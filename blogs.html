<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Posts - AsterIDE Blog</title>
  <script>
    (function () {
      const key = "aster_blog_theme";
      let theme = null;
      try {
        theme = localStorage.getItem(key);
      } catch (error) {
        theme = null;
      }
      if (theme !== "dark" && theme !== "light") {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        theme = prefersDark ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div class="petals" id="petals"></div>
  <div class="watermark" aria-hidden="true">posts</div>

  <div class="page">
    <header class="top-bar">
      <div class="site-id">
        <span class="dot"></span>
        <a href="https://asteride.dev">asteride.dev</a>
        <span class="crumb-sep">/</span>
        <a href="index.html">blog</a>
        <span class="crumb-sep">/</span>
        <span class="crumb-current">posts</span>
      </div>
      <div class="top-right">
        <button class="menu-toggle" id="menu-btn" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="header-nav">☰</button>
        <nav class="header-nav" id="header-nav" aria-label="Header navigation">
          <a class="header-link" href="index.html">home</a>
          <a class="header-link active" href="blogs.html">all posts</a>
          <button class="theme-toggle" id="theme-btn" aria-label="Toggle theme">☀</button>
        </nav>
      </div>
    </header>

    <main class="main">
      <p class="kicker">directory</p>
      <h1 class="title">all blog posts</h1>
      <p class="intro">Posts are sorted by date (newest first) using metadata from <code>posts/posts.json</code>.</p>

      <section>
        <div class="section-head">
          <h2>Pinned Posts</h2>
        </div>
        <div id="pinned-posts" class="card-grid" aria-live="polite"></div>
      </section>

      <section id="all-posts-section">
        <div class="section-head">
          <h2>Post Archive</h2>
        </div>
        <div id="all-posts" class="card-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-copy">© asteride.dev 2026</span>
      <nav class="footer-links">
        <a href="https://asteride.dev">Main site</a>
        <a href="https://github.com/Aster-IDE" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </footer>
  </div>

  <script src="js/blog.js"></script>
  <script>
    (async function initBlogsPage() {
      window.blogData.initChrome();
      const allPostsMount = document.getElementById("all-posts");
      const pinnedPostsMount = document.getElementById("pinned-posts");
      try {
        const posts = await window.blogData.loadPosts();
        const pinnedPosts = window.blogData.sortPinnedPosts(posts.filter((post) => post.pinned));
        window.blogData.renderPostList(posts, allPostsMount);

        if (pinnedPosts.length) {
          window.blogData.renderPostList(pinnedPosts, pinnedPostsMount);
        } else {
          pinnedPostsMount.parentElement.style.display = "none";
        }
      } catch (error) {
        console.error(error);
        window.blogData.setErrorState(allPostsMount, "Unable to load the blog directory right now.");
        pinnedPostsMount.parentElement.style.display = "none";
      }
    })();
  </script>
</body>
</html>
