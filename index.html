<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>coming soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-darkest:  rgb(35, 20, 28);
      --bg-dark:     rgb(45, 28, 38);
      --bg-mid:      rgb(55, 35, 45);
      --bg-light:    rgb(70, 45, 58);
      --bg-lighter:  rgb(85, 55, 70);
      --border:      rgb(85, 55, 70);
      --text-primary:   rgb(255, 235, 245);
      --text-secondary: rgb(200, 160, 180);
      --text-muted:     rgb(150, 110, 130);
      --accent:      rgb(255, 130, 180);
      --accent-hot:  rgb(255, 90, 150);
      --accent-light: rgb(255, 200, 220);
      --pink-300:    rgb(255, 180, 210);
      --pink-900:    rgb(130, 30, 65);
    }

    [data-theme="light"] {
      --bg-darkest:  rgb(255, 252, 254);
      --bg-dark:     rgb(255, 248, 252);
      --bg-mid:      rgb(255, 240, 248);
      --bg-light:    rgb(245, 230, 240);
      --bg-lighter:  rgb(235, 220, 230);
      --border:      rgb(235, 220, 230);
      --text-primary:   rgb(80, 40, 60);
      --text-secondary: rgb(130, 80, 105);
      --text-muted:     rgb(170, 120, 145);
      --accent:      rgb(220, 80, 140);
      --accent-hot:  rgb(255, 90, 150);
      --accent-light: rgb(255, 180, 210);
      --pink-300:    rgb(255, 200, 225);
      --pink-900:    rgb(145, 50, 85);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg-darkest);
      color: var(--text-primary);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .petal {
      position: absolute;
      width: 6px;
      height: 8px;
      background: var(--accent);
      border-radius: 80% 0 80% 0;
      opacity: 0;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 0; }
      5%   { opacity: 0.18; }
      95%  { opacity: 0.12; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .page {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      padding: 0 2.2rem;
    }

    .top-bar {
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      animation: fade-up 0.5s ease forwards 0.1s;
    }

    .site-id {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .site-id a { color: inherit; text-decoration: none; transition: color 0.15s; }
    .site-id a:hover { color: var(--accent); }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-hot);
      box-shadow: 0 0 8px var(--accent-hot);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .top-right { display: flex; align-items: center; gap: 1rem; }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    .status-tag { font-size: 0.62rem; letter-spacing: 0.1em; color: var(--text-muted); }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem 0 3rem;
    }

    .kicker {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fade-up 0.5s ease forwards 0.3s;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .kicker::before {
      content: '';
      display: inline-block;
      width: 1.8rem;
      height: 1px;
      background: var(--accent);
    }

    .headline {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(3rem, 9vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fade-up 0.6s ease forwards 0.45s;
    }
    .headline em { font-style: italic; color: var(--accent); }

    .code-deco {
      font-size: 0.72rem;
      line-height: 1.8;
      color: var(--text-muted);
      background: var(--bg-dark);
      border-left: 2px solid var(--accent);
      padding: 0.9rem 1.2rem;
      margin-bottom: 2.5rem;
      max-width: 38ch;
      opacity: 0;
      animation: fade-up 0.5s ease forwards 0.6s;
      transition: background 0.3s;
    }
    .code-deco .c { color: var(--text-muted); }
    .code-deco .k { color: var(--accent); }
    .code-deco .s { color: var(--accent-light); }
    .code-deco .n { color: var(--pink-300); }

    .body-copy {
      font-size: 0.82rem;
      line-height: 1.9;
      color: var(--text-secondary);
      max-width: 42ch;
      opacity: 0;
      animation: fade-up 0.5s ease forwards 0.72s;
    }
    .body-copy strong { color: var(--text-primary); font-weight: 400; }

    .notify {
      margin-top: 2.8rem;
      opacity: 0;
      animation: fade-up 0.5s ease forwards 0.85s;
    }

    .notify-label {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: block;
    }

    .notify-row {
      display: flex;
      max-width: 380px;
      border: 1px solid var(--border);
      background: var(--bg-dark);
      transition: border-color 0.2s, background 0.3s;
    }
    .notify-row:focus-within { border-color: var(--accent); }

    .notify-row input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--text-primary);
    }
    .notify-row input::placeholder { color: var(--text-muted); }

    .notify-row button {
      padding: 0.75rem 1.1rem;
      background: var(--accent-hot);
      color: rgb(35, 20, 28);
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .notify-row button:hover { background: var(--accent); }

    .thanks {
      display: none;
      font-size: 0.72rem;
      color: var(--accent);
      margin-top: 0.6rem;
      letter-spacing: 0.05em;
    }

    .footer {
      border-top: 1px solid var(--border);
      padding: 1.2rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      animation: fade-up 0.4s ease forwards 1s;
    }

    .footer-copy { font-size: 0.62rem; letter-spacing: 0.05em; color: var(--text-muted); }
    .footer-links { display: flex; gap: 1.4rem; }
    .footer-links a {
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-links a:hover { color: var(--accent); }

    .watermark {
      position: fixed;
      bottom: -0.05em;
      right: -0.05em;
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: clamp(10rem, 28vw, 22rem);
      color: transparent;
      -webkit-text-stroke: 1px var(--bg-light);
      line-height: 1;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: fade 1s ease forwards 0.5s;
      z-index: 0;
      transition: -webkit-text-stroke-color 0.3s;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="petals" id="petals"></div>
  <div class="watermark" aria-hidden="true">soon</div>

  <div class="page">
    <header class="top-bar">
      <div class="site-id">
        <span class="dot"></span>
        <a href="https://asteride.dev">asteride.dev</a>
        <span style="color:var(--bg-lighter)">/</span>
        <span>blog</span>
      </div>
      <div class="top-right">
        <span class="status-tag">in progress</span>
        <button class="theme-toggle" id="theme-btn" aria-label="Toggle theme">light</button>
      </div>
    </header>

    <main class="main">
      <p class="kicker">blog</p>

      <h1 class="headline">
        something will be here
        <em>eventually.</em>
      </h1>

      <div class="code-deco" aria-hidden="true">
        <span class="c">// blog.rs</span><br/>
        <span class="k">fn</span> <span class="n"> next_post</span>() -&gt; <span class="n">Option</span>&lt;<span class="n">Post</span>&gt; {<br/>
        &nbsp;&nbsp;<span class="k">todo!</span>(<span class="s">"coming soon"</span>)<br/>
        }
      </div>

      <p class="body-copy">
        check back soon please this isnt ready
      </p>
    </main>

    <footer class="footer">
      <span class="footer-copy">© asteride.dev 2026</span>
      <nav class="footer-links">
        <a href="https://asteride.dev">Main site</a>
        <a href="https://github.com/Aster-IDE" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </footer>
  </div>

  <script>
    // Falling petals
    const container = document.getElementById('petals');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.width = (4 + Math.random() * 5) + 'px';
      p.style.height = (6 + Math.random() * 6) + 'px';
      p.style.animationDuration = (8 + Math.random() * 14) + 's';
      p.style.animationDelay = (Math.random() * 16) + 's';
      p.style.borderRadius = Math.random() > 0.5 ? '80% 0 80% 0' : '0 80% 0 80%';
      container.appendChild(p);
    }

    // Theme toggle
    const themeBtn = document.getElementById('theme-btn');
    let dark = true;
    themeBtn.addEventListener('click', () => {
      dark = !dark;
      document.documentElement.setAttribute('data-theme', dark ? '' : 'light');
      themeBtn.textContent = dark ? 'light' : 'dark';
    });
  </script>

</body>
</html>
