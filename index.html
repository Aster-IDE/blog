<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AsterIDE Blog</title>
  <link rel="icon" type="image/x-icon" href="https://asteride.dev/favicon.ico"/>
  <script>
    (function () {
      const key = "aster_blog_theme";
      let theme = null;
      try {
        theme = localStorage.getItem(key);
      } catch (error) {
        theme = null;
      }
      if (theme !== "dark" && theme !== "light") {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        theme = prefersDark ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />

</head>

    <main class="main">
      <!-- <p class="kicker">blog</p> -->
      <h1 class="title">the <em>AsterIDE</em> blog</h1>
      <p class="intro">
        Blog page for AsterIDE — A Simple Text Editor written in Rust.
      </p>

      <section>
        <div class="section-head">
          <h2>Pinned Posts</h2>
          <a href="blogs.html">View all</a>
        </div>
        <div id="pinned-posts-home" class="card-grid" aria-live="polite"></div>
      </section>

      <section id="latest-posts-section">
        <div class="section-head">
          <h2>Latest Posts</h2>
          <a href="blogs.html">View all</a>
        </div>
        <div id="latest-posts" class="card-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-copy">© asteride.dev 2026</span>
      <nav class="footer-links">
        <a href="https://asteride.dev">Main site</a>
        <a href="https://github.com/Aster-IDE" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </footer>
  </div>

  <script src="js/blog.js"></script>
  <script>
    (async function initHomePage() {
      window.blogData.initChrome();
      const latestMount = document.getElementById("latest-posts");
      const pinnedMount = document.getElementById("pinned-posts-home");
      try {
        const posts = await window.blogData.loadPosts();
        const pinnedPosts = window.blogData.sortPinnedPosts(posts.filter((post) => post.pinned));

        if (pinnedPosts.length) {
          window.blogData.renderPostList(pinnedPosts, pinnedMount);
        } else {
          pinnedMount.parentElement.style.display = "none";
        }

        window.blogData.renderPostList(posts, latestMount, 3);
      } catch (error) {
        console.error(error);
        window.blogData.setErrorState(latestMount, "Unable to load latest posts right now.");
        pinnedMount.parentElement.style.display = "none";
      }
    })();
  </script>
</body>
</html>
